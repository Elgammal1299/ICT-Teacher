    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  shimmer_animation: ^2.2.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  equatable: ^2.0.7
  get_it: ^8.2.0
  pretty_dio_logger: ^1.4.0
  dio: ^5.8.0+1
