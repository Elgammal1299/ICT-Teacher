  syncfusion_flutter_pdfviewer: ^31.1.17
  no_screenshot: ^2.0.1
  jwt_decoder: ^2.0.1
  video_player: ^2.11.1
  package_info_plus: ^9.0.1
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.6
  flutter_speed_dial: ^7.0.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  retrofit_generator: ^10.0.2
  build_runner: ^2.7.0
  json_serializable: ^6.11.0

flutter:
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/video/
  #   - images/a_dot_ham.jpeg

  # example:
  fonts:
    - family: arsura
      fonts:
        - asset: assets/fonts/arsura.ttf
    
    - family: uthmanic
      fonts:
        - asset: assets/fonts/QCF2BSMLfonts/UthmanTN1 Ver10.otf
    - family: Amiri
      fonts:
        - asset: assets/fonts/amiri-regular.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Bold-3.ttf
        - asset: assets/fonts/Cairo-Regular.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
